<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya - Desti Puspita</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            scroll-behavior: smooth;
            background-color: #fdfcfd;
            overflow-x: hidden;
        }

        /* LATAR BELAKANG GRADASI MESH */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -10; overflow: hidden; pointer-events: none;
        }
        .mesh-circle {
            position: absolute; border-radius: 50%; filter: blur(80px);
            opacity: 0.25; animation: pulse-glow 10s infinite alternate;
        }
        @media (min-width: 768px) { .mesh-circle { filter: blur(120px); } }
        @keyframes pulse-glow {
            from { transform: scale(1); opacity: 0.2; }
            to { transform: scale(1.3); opacity: 0.4; }
        }

        /* Animasi Reveal */
        .reveal {
            opacity: 0; 
            transform: translateY(25px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }

        /* Animasi Mengapung Foto Profil */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .float-anim {
            animation: floating 4s ease-in-out infinite;
        }

        /* Dropdown Bahasa */
        #lang-dropdown {
            display: none;
            position: absolute; top: 100%; right: 0; margin-top: 0.5rem;
            background: white; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }
        #lang-dropdown.open { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Efek Interaktif Timbul */
        .timbul-interaktif {
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 6px 6px 15px rgba(0,0,0,0.03), -6px -6px 15px rgba(255,255,255,0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .timbul-interaktif:hover {
            transform: translateY(-8px);
            box-shadow: 12px 12px 30px rgba(0,0,0,0.06);
            background: white;
        }

        .desti-name-center {
            letter-spacing: 0.02em; 
            color: #7F1D1D; 
            text-align: center;
            font-size: 1.8rem; 
            font-weight: 900; 
            text-transform: uppercase;
            white-space: nowrap; 
            display: block;
            line-height: 1.1;
        }
        @media (min-width: 768px) {
            .desti-name-center { 
                letter-spacing: 0.05em; 
                font-size: 2.5rem; 
            }
        }

        .bar-container { width: 100%; background: #f1f5f9; height: 0.5rem; border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; transform: scaleX(0); transform-origin: left; transition: transform 2.5s ease-out; }
        .reveal.active .bar-fill { transform: scaleX(1); }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .marquee-track { display: flex; width: max-content; animation: marquee 40s linear infinite; }
    </style>
</head>
<body class="selection:bg-pink-200">

    <audio id="bg-music" loop>
        <source src="Maudy Ayunda - Kejar Mimpi _ Official Music Video - (64 Kbps).mp3" type="audio/mpeg">
    </audio>

    <div class="mesh-bg">
        <div class="mesh-circle bg-pink-300" style="top: -10%; left: -10%; width: 90%; height: 90%;"></div>
        <div class="mesh-circle bg-blue-200" style="bottom: -10%; right: -5%; width: 80%; height: 80%;"></div>
    </div>

    <!-- Header -->
    <header class="fixed w-full z-50 px-4 py-2 md:py-4">
        <div class="max-w-5xl mx-auto bg-white/70 backdrop-blur-2xl px-6 py-2 rounded-full shadow-lg border border-white/50 flex justify-between items-center">
            <span class="text-[10px] font-black uppercase tracking-[0.4em] text-pink-900/60">Portofolio</span>
            <div class="flex items-center gap-4">
                <nav class="hidden md:flex space-x-8">
                    <a href="#menu" class="hover:text-pink-600 font-bold text-[10px] uppercase tracking-widest text-slate-500" data-t="nav_menu">Menu</a>
                    <a href="#capaian" class="hover:text-pink-600 font-bold text-[10px] uppercase tracking-widest text-slate-500" data-t="nav_capaian">Pencapaian</a>
                </nav>
                <div class="relative">
                    <button id="lang-toggle" class="flex items-center gap-2 p-2 rounded-xl bg-white/80 border border-pink-100">
                        <i data-lucide="languages" class="w-4 h-4 text-pink-600"></i>
                        <span id="current-lang-text" class="text-[10px] font-bold">ID</span>
                    </button>
                    <div id="lang-dropdown">
                        <button onclick="changeLanguage('id')" class="w-full text-left px-4 py-2 text-[10px] font-bold hover:bg-pink-50">INDONESIA</button>
                        <button onclick="changeLanguage('jp')" class="w-full text-left px-4 py-2 text-[10px] font-bold hover:bg-pink-50">日本語</button>
                        <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-2 text-[10px] font-bold hover:bg-pink-50">ENGLISH</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section id="menu" class="min-h-screen flex flex-col items-center justify-center text-center px-6">
        <div class="reveal active space-y-6">
            <div class="float-anim w-40 h-40 md:w-52 md:h-52 mx-auto">
                <img src="https://i.imgur.com/ZZnypaj.jpeg" class="w-full h-full object-cover rounded-full border-4 border-white shadow-2xl" />
            </div>
            <h1 id="hero-name" class="desti-name-center">DESTI PUSPITA</h1>
            <p class="text-[10px] md:text-[12px] font-bold uppercase tracking-widest text-slate-500" data-t="hero_sub">Penutur Bahasa Jepang • Kreatif • Layanan Profesional</p>
        </div>
    </section>

    <!-- Footer Revised -->
    <footer class="py-16 px-6 text-center border-t border-pink-100 bg-white/40 backdrop-blur-xl">
        <div class="max-w-4xl mx-auto flex flex-col items-center space-y-8">
            <div class="flex justify-center items-center gap-6">
                <a href="https://wa.me/6289506878654" target="_blank" class="p-3 bg-white rounded-xl shadow-sm text-green-500">
                    <i data-lucide="phone" class="w-6 h-6"></i>
                </a>
                <!-- Instagram Link with correct Icon -->
                <a href="https://www.instagram.com/tentang_desti_?igsh=MXNqcGhvMmF3ZDl4bw==" target="_blank" class="p-3 bg-white rounded-xl shadow-sm text-pink-600">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" class="w-6 h-6">
                </a>
                <a href="mailto:destipuspita.official@gmail.com" class="p-3 bg-white rounded-xl shadow-sm text-red-700">
                    <i data-lucide="mail" class="w-6 h-6"></i>
                </a>
            </div>
            <p class="text-[12px] font-black text-slate-500 uppercase tracking-[0.4em]" data-t="footer_name">Tujuan Bermakna • Desti Puspita</p>
            <p class="text-[9px] font-bold text-slate-300 uppercase tracking-[0.4em]">© 2026 • Portofolio Profesional</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        const translations = {
            id: {
                nav_menu: "Menu", nav_capaian: "Pencapaian",
                hero_sub: "Penutur Bahasa Jepang • Kreatif • Layanan Profesional",
                footer_name: "Tujuan Bermakna • Desti Puspita"
            },
            jp: {
                nav_menu: "メニュー", nav_capaian: "実績",
                hero_sub: "日本語話者 • クリエイティブ • プロフェッショナル",
                footer_name: "意味のある目的 • デスティ・プスピタ"
            },
            en: {
                nav_menu: "Menu", nav_capaian: "Achievements",
                hero_sub: "Japanese Speaker • Creative • Professional Services",
                footer_name: "Meaningful Purpose • Desti Puspita"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.querySelectorAll('[data-t]').forEach(el => {
                const key = el.getAttribute('data-t');
                if (t[key]) el.innerHTML = t[key];
            });
            document.getElementById('current-lang-text').innerText = lang.toUpperCase();
            document.getElementById('lang-dropdown').classList.remove('open');
        }

        document.getElementById('lang-toggle').onclick = (e) => {
            e.stopPropagation();
            document.getElementById('lang-dropdown').classList.toggle('open');
        };

        window.onclick = () => {
            document.getElementById('lang-dropdown').classList.remove('open');
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
